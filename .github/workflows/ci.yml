name: Workspace checks
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - name: Verify server readiness and client startup
        run: |
          node apps/server/dist/index.js > server.log 2>&1 &
          server_pid=$!
          pnpm --filter @pumpworks/client dev --host 127.0.0.1 > client.log 2>&1 &
          client_pid=$!
          trap 'kill "$server_pid" "$client_pid" 2>/dev/null || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:5173/ | grep -q '<title>Pumpworks</title>' || { cat client.log; exit 1; }
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:2567/health || { cat server.log; exit 1; }
          actual="$(curl -fsS http://127.0.0.1:5173/health)"
          test "$actual" = '{"status":"ready","protocolVersion":1}'
